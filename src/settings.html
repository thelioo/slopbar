<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>SlopBar</title>
  <link rel="stylesheet" href="settings.css" />
</head>
<body>
  <!-- Title bar drawn on the window's Mica, like the Settings app's. -->
  <div class="titlebar" data-tauri-drag-region>
    <img src="icon.png" alt="" width="16" height="16" data-tauri-drag-region />
    <span data-tauri-drag-region>SlopBar</span>
    <button id="close" class="caption" data-i18n-title="close">&#xE8BB;</button>
  </div>
  <div class="shell">
  <nav class="sidebar" data-i18n-aria="settingsPages">
    <button class="nav active" data-page="accounts">
      <svg viewBox="0 0 20 20"><circle cx="8" cy="7" r="3"/><path d="M2.5 16.5c.6-3 2.8-4.5 5.5-4.5s4.9 1.5 5.5 4.5"/><path d="M13 4.2a3 3 0 0 1 0 5.6M15 12.4c1.3.6 2.1 1.9 2.5 4.1"/></svg>
      <span data-i18n="sAccounts"></span>
    </button>
    <button class="nav" data-page="subscriptions">
      <svg viewBox="0 0 20 20"><rect x="2.5" y="4.5" width="15" height="11" rx="2"/><path d="M2.5 8h15M5.5 12.5h3"/></svg>
      <span data-i18n="sSubscriptions"></span>
    </button>
    <button class="nav" data-page="usage">
      <svg viewBox="0 0 20 20"><path d="M3.5 16.5h13M5.5 13.5v-4M10 13.5v-9M14.5 13.5v-6"/></svg>
      <span data-i18n="sUsage"></span>
    </button>
    <button class="nav" data-page="notifications">
      <svg viewBox="0 0 20 20"><path d="M5 8a5 5 0 0 1 10 0v3.5l1.5 2.5h-13L5 11.5z"/><path d="M8 16.5a2 2 0 0 0 4 0"/></svg>
      <span data-i18n="sNotifications"></span>
    </button>
    <button class="nav" data-page="data">
      <svg viewBox="0 0 20 20"><path d="M16.5 10a6.5 6.5 0 1 1-1.9-4.6M16.5 3.5v3.5H13"/></svg>
      <span data-i18n="sData"></span>
    </button>
    <button class="nav" data-page="general">
      <svg viewBox="0 0 24 24"><path d="M12.22 2h-.44a2 2 0 0 0-2 2v.18a2 2 0 0 1-1 1.73l-.43.25a2 2 0 0 1-2 0l-.15-.08a2 2 0 0 0-2.73.73l-.22.38a2 2 0 0 0 .73 2.73l.15.1a2 2 0 0 1 1 1.72v.51a2 2 0 0 1-1 1.74l-.15.09a2 2 0 0 0-.73 2.73l.22.38a2 2 0 0 0 2.73.73l.15-.08a2 2 0 0 1 2 0l.43.25a2 2 0 0 1 1 1.73V20a2 2 0 0 0 2 2h.44a2 2 0 0 0 2-2v-.18a2 2 0 0 1 1-1.73l.43-.25a2 2 0 0 1 2 0l.15.08a2 2 0 0 0 2.73-.73l.22-.39a2 2 0 0 0-.73-2.73l-.15-.08a2 2 0 0 1-1-1.74v-.5a2 2 0 0 1 1-1.74l.15-.09a2 2 0 0 0 .73-2.73l-.22-.38a2 2 0 0 0-2.73-.73l-.15.08a2 2 0 0 1-2 0l-.43-.25a2 2 0 0 1-1-1.73V4a2 2 0 0 0-2-2z"/><circle cx="12" cy="12" r="3"/></svg>
      <span data-i18n="sGeneral"></span>
    </button>
    <button class="nav" data-page="health">
      <svg viewBox="0 0 20 20"><path d="M10 16.5s-6.5-3.8-6.5-8.6A3.4 3.4 0 0 1 10 5.6a3.4 3.4 0 0 1 6.5 2.3c0 4.8-6.5 8.6-6.5 8.6z"/><path d="M5 10h2.5l1.2-2 1.8 4 1.2-2H15"/></svg>
      <span data-i18n="sHealth"></span>
      <span class="nav-badge" id="health-nav-badge" hidden></span>
    </button>
    <div class="version" id="version"></div>
  </nav>

  <main>
    <!-- Accounts -->
    <section class="page active" id="page-accounts">
      <header><h1 data-i18n="sAccounts"></h1><p data-i18n="descAccounts"></p></header>
      <section class="guide" id="guide" aria-labelledby="guide-title" hidden></section>
      <div id="accounts"></div>
      <p class="hint notice" id="add-hint" hidden data-i18n="addHint"></p>

      <h2 data-i18n="bulkTitle"></h2>
      <div class="group">
        <div class="row">
          <div class="title"><label data-i18n="signInAll"></label><small id="sign-in-all-hint"></small></div>
          <button class="btn" id="sign-in-all" data-i18n="signInAllButton"></button>
        </div>
        <div class="row">
          <div class="title"><label for="sign-in-all-monitoring" data-i18n="signInAllMonitoring"></label><small data-i18n="signInAllMonitoringHint"></small></div>
          <input type="checkbox" class="switch" id="sign-in-all-monitoring" checked />
        </div>
        <div class="row">
          <div class="title"><label for="signin-window" data-i18n="signinWindow"></label><small data-i18n="signinWindowHint"></small></div>
          <div class="select"><select id="signin-window"></select></div>
        </div>
        <div class="row">
          <div class="title"><label data-i18n="signinForget"></label><small id="signin-forget-hint"></small></div>
          <button class="btn" id="signin-forget" data-i18n="signinForgetButton"></button>
        </div>
        <div class="row">
          <div class="title"><label data-i18n="bulkConnect"></label><small id="bulk-connect-hint"></small></div>
          <button class="btn" id="bulk-connect" data-i18n="bulkConnectButton"></button>
        </div>
        <div class="row">
          <div class="title"><label data-i18n="bulkRemove"></label><small id="bulk-remove-hint"></small></div>
          <button class="btn" id="bulk-remove" data-i18n="bulkRemoveButton"></button>
        </div>
      </div>
      <p class="hint notice" id="bulk-status" role="status" hidden></p>

      <h2 data-i18n="pinsTitle"></h2>
      <p class="hint pins-intro" data-i18n="pinsIntro"></p>
      <div class="group" id="pins"></div>
      <div class="group">
        <div class="row pin-add">
          <input type="text" id="pin-folder" spellcheck="false" data-i18n-title="pinFolder" />
          <div class="select"><select id="pin-account"></select></div>
          <button class="btn" id="pin-save" data-i18n="pinSave"></button>
        </div>
      </div>
      <p class="hint" id="pins-launcher"></p>
      <p class="hint" id="pins-status" role="status" hidden></p>
    </section>

    <!-- Subscriptions -->
    <section class="page" id="page-subscriptions">
      <header><h1 data-i18n="sSubscriptions"></h1><p data-i18n="descSubscriptions"></p></header>
      <div id="subscriptions"></div>
      <h2 data-i18n="sCalendar"></h2>
      <div class="group">
        <div class="row">
          <div class="title"><label for="calendar-enabled" data-i18n="calendarKeep"></label><small data-i18n="calendarKeepHint"></small></div>
          <input type="checkbox" class="switch" id="calendar-enabled" />
        </div>
        <div class="row">
          <div class="presence-path">
            <input type="text" id="calendar-path" spellcheck="false" />
            <button class="btn" id="calendar-save" data-i18n="presenceSave"></button>
            <button class="btn" id="calendar-export" data-i18n="calendarExport"></button>
          </div>
        </div>
      </div>
      <p class="hint" id="calendar-status" role="status" hidden></p>
      <p class="hint" data-i18n="subDatesHow"></p>
      <p class="hint" data-i18n="subHowJudged"></p>
      <p class="hint" data-i18n="subNoCancel"></p>
    </section>

    <!-- Usage -->
    <section class="page" id="page-usage">
      <header><h1 data-i18n="sUsage"></h1><p data-i18n="descUsage"></p></header>
      <div class="usage-controls">
        <label for="usage-days" data-i18n="usagePeriod"></label>
        <div class="select"><select id="usage-days"></select></div>
      </div>
      <div id="usage"></div>
      <p class="hint" data-i18n="usageHow"></p>
      <h2 data-i18n="sExportCsv"></h2>
      <div class="group">
        <div class="row">
          <div class="title"><label for="export-folder" data-i18n="exportCsv"></label><small data-i18n="exportCsvHint"></small></div>
        </div>
        <div class="row">
          <div class="presence-path">
            <input type="text" id="export-folder" spellcheck="false" />
            <button class="btn" id="export-csv" data-i18n="exportCsvButton"></button>
          </div>
        </div>
      </div>
      <p class="hint" id="export-status" role="status" hidden></p>
    </section>

    <!-- Notifications -->
    <section class="page" id="page-notifications">
      <header><h1 data-i18n="sNotifications"></h1><p data-i18n="descNotifications"></p></header>
      <div class="group">
        <div class="row">
          <div class="title"><label for="notify-usage" data-i18n="notifyUsage"></label><small data-i18n="notifyUsageHint"></small></div>
          <input type="checkbox" class="switch" id="notify-usage" />
        </div>
        <div class="row">
          <div class="title"><label for="notify-resets" data-i18n="notifyResets"></label><small data-i18n="notifyResetsHint"></small></div>
          <input type="checkbox" class="switch" id="notify-resets" />
        </div>
        <div class="row">
          <div class="title"><label for="notify-switches" data-i18n="notifySwitches"></label><small data-i18n="notifySwitchesHint"></small></div>
          <input type="checkbox" class="switch" id="notify-switches" />
        </div>
        <div class="row">
          <div class="title"><label for="notify-unexpected_use" data-i18n="notifyUnexpected"></label><small data-i18n="notifyUnexpectedHint"></small></div>
          <input type="checkbox" class="switch" id="notify-unexpected_use" />
        </div>
        <div class="row">
          <div class="title"><label for="notify-renewals" data-i18n="notifyRenewals"></label><small data-i18n="notifyRenewalsHint"></small></div>
          <input type="checkbox" class="switch" id="notify-renewals" />
        </div>
        <div class="row">
          <div class="title"><label for="notify-extra_usage" data-i18n="notifyExtraUsage"></label><small data-i18n="notifyExtraUsageHint"></small></div>
          <input type="checkbox" class="switch" id="notify-extra_usage" />
        </div>
        <div class="row">
          <div class="title"><label for="notify-burn" data-i18n="notifyBurn"></label><small data-i18n="notifyBurnHint"></small></div>
          <input type="checkbox" class="switch" id="notify-burn" />
        </div>
        <div class="row">
          <div class="title"><label for="notify-reset_credits" data-i18n="notifyResetCredits"></label><small data-i18n="notifyResetCreditsHint"></small></div>
          <input type="checkbox" class="switch" id="notify-reset_credits" />
        </div>
        <div class="row">
          <div class="title"><label for="notify-digest" data-i18n="notifyDigest"></label><small data-i18n="notifyDigestHint"></small></div>
          <input type="checkbox" class="switch" id="notify-digest" />
        </div>
      </div>
      <h2 data-i18n="sPhone"></h2>
      <div class="group">
        <div class="row">
          <div class="title"><label for="phone-enabled" data-i18n="phoneEnabled"></label><small data-i18n="phoneHint"></small></div>
          <input type="checkbox" class="switch" id="phone-enabled" />
        </div>
        <div class="row">
          <div class="title"><label for="phone-url" data-i18n="phoneUrl"></label><small data-i18n="phoneUrlHint"></small></div>
        </div>
        <div class="row">
          <div class="presence-path">
            <input type="text" id="phone-url" spellcheck="false" placeholder="https://ntfy.sh/your-topic" />
            <button class="btn" id="phone-url-save" data-i18n="presenceSave"></button>
          </div>
        </div>
        <div class="row">
          <div class="title"><label for="phone-token" data-i18n="phoneToken"></label><small id="phone-token-state"></small></div>
        </div>
        <div class="row">
          <div class="presence-path">
            <input type="password" id="phone-token" autocomplete="off" spellcheck="false" />
            <button class="btn" id="phone-token-save" data-i18n="presenceSave"></button>
            <button class="btn" id="phone-token-clear" data-i18n="phoneTokenClear"></button>
          </div>
        </div>
        <div class="row">
          <div class="title"><label for="phone-include_names" data-i18n="phoneNames"></label><small data-i18n="phoneNamesHint"></small></div>
          <input type="checkbox" class="switch" id="phone-include_names" />
        </div>
        <div class="row">
          <label for="phone-kind-renewal" data-i18n="phoneKindRenewal"></label>
          <input type="checkbox" class="switch" id="phone-kind-renewal" />
        </div>
        <div class="row">
          <label for="phone-kind-unexpected_use" data-i18n="phoneKindUnexpected"></label>
          <input type="checkbox" class="switch" id="phone-kind-unexpected_use" />
        </div>
        <div class="row">
          <label for="phone-kind-runaway" data-i18n="phoneKindRunaway"></label>
          <input type="checkbox" class="switch" id="phone-kind-runaway" />
        </div>
        <div class="row">
          <label for="phone-kind-limit_reached" data-i18n="phoneKindLimit"></label>
          <input type="checkbox" class="switch" id="phone-kind-limit_reached" />
        </div>
        <div class="row">
          <div class="title"><label data-i18n="phoneTest"></label><small data-i18n="phoneTestHint"></small></div>
          <button class="btn" id="phone-test" data-i18n="phoneTestButton"></button>
        </div>
      </div>
      <p class="hint" id="phone-status" role="status" hidden></p>
    </section>

    <!-- Data -->
    <section class="page" id="page-data">
      <header><h1 data-i18n="sData"></h1><p data-i18n="descData"></p></header>
      <div class="group">
        <div class="row">
          <label for="refresh" data-i18n="sRefresh"></label>
          <div class="select"><select id="refresh"></select></div>
        </div>
        <div class="row">
          <div class="title"><label for="auto-monitoring" data-i18n="autoMonitoring"></label><small data-i18n="autoMonitoringHint"></small></div>
          <input type="checkbox" class="switch" id="auto-monitoring" />
        </div>
      </div>
      <h2 data-i18n="sProviders"></h2>
      <div class="group">
        <div class="row">
          <label for="claude" class="with-mark"><span class="logo claude" data-mark="claude"></span>Claude</label>
          <input type="checkbox" class="switch" id="claude" />
        </div>
        <div class="row">
          <label for="codex" class="with-mark"><span class="logo codex" data-mark="codex"></span>Codex</label>
          <input type="checkbox" class="switch" id="codex" />
        </div>
        <div class="row">
          <div class="title"><label for="wsl-accounts" data-i18n="wslAccounts"></label><small data-i18n="wslAccountsHint"></small></div>
          <div class="select"><select id="wsl-accounts"></select></div>
        </div>
        <div class="row">
          <div class="title"><label for="wsl-rescan" data-i18n="wslRescan"></label><small id="wsl-rescan-hint" data-i18n="wslRescanHint"></small></div>
          <button class="btn" id="wsl-rescan" data-i18n="wslRescanButton"></button>
        </div>
      </div>
      <h2 data-i18n="sPresence"></h2>
      <div class="group">
        <div class="row">
          <div class="title"><label for="presence" data-i18n="sharePresence"></label><small data-i18n="sharePresenceHint"></small></div>
          <div class="select"><select id="presence"></select></div>
        </div>
        <div class="row" id="presence-custom" hidden>
          <div class="presence-path">
            <input type="text" id="presence-path" spellcheck="false" />
            <button class="btn" id="presence-save" data-i18n="presenceSave"></button>
          </div>
        </div>
        <div class="row">
          <div class="title"><label for="account-roster" data-i18n="rosterShare"></label><small data-i18n="rosterShareHint"></small></div>
          <input type="checkbox" class="switch" id="account-roster" />
        </div>
        <div class="row">
          <div class="title"><label for="roster-passphrase" data-i18n="rosterPassphrase"></label><small id="roster-passphrase-state"></small></div>
        </div>
        <div class="row">
          <div class="presence-path">
            <input type="password" id="roster-passphrase" autocomplete="new-password" spellcheck="false" />
            <button class="btn" id="roster-passphrase-save" data-i18n="rosterPassphraseSave"></button>
            <button class="btn" id="roster-passphrase-clear" data-i18n="phoneTokenClear"></button>
          </div>
        </div>
      </div>
      <p class="hint" id="presence-rclone-hint" data-i18n="presenceRcloneHint" hidden></p>
      <p class="hint" id="presence-status" role="status" hidden></p>
      <p class="hint" id="roster-status" role="status" hidden></p>
    </section>

    <!-- General -->
    <section class="page" id="page-general">
      <header><h1 data-i18n="sGeneral"></h1><p data-i18n="descGeneral"></p></header>
      <div class="group">
        <div class="row">
          <label for="language" data-i18n="sLanguage"></label>
          <div class="select"><select id="language"></select></div>
        </div>
        <div class="row">
          <label for="startup" data-i18n="sStartup"></label>
          <input type="checkbox" class="switch" id="startup" />
        </div>
        <div class="row">
          <div class="title"><label for="compact-flyout" data-i18n="compactFlyout"></label><small id="compact-flyout-hint"></small></div>
          <input type="checkbox" class="switch" id="compact-flyout" />
        </div>
        <div class="row">
          <div class="title"><label for="guide-reopen" data-i18n="guideReopen"></label><small data-i18n="guideReopenHint"></small></div>
          <button class="btn" id="guide-reopen" data-i18n="guideReopenButton"></button>
        </div>
        <div class="row">
          <div class="title"><label for="hotkey" data-i18n="switcherShortcut"></label><small id="hotkey-hint"></small></div>
          <div class="presence-path hotkey">
            <input type="text" id="hotkey" spellcheck="false" />
            <button class="btn" id="hotkey-save" data-i18n="hotkeySave"></button>
          </div>
        </div>
      </div>

      <h2 data-i18n="sUpdates"></h2>
      <div class="group">
        <div class="row">
          <label for="auto-update" data-i18n="autoUpdate"></label>
          <input type="checkbox" class="switch" id="auto-update" />
        </div>
        <div class="row">
          <div class="title">
            <label id="version-label"></label>
            <small id="update-status"></small>
          </div>
          <button class="btn" id="check-updates"></button>
        </div>
      </div>
      <h2 data-i18n="sDiagnostics"></h2>
      <div class="group">
        <div class="row">
          <div class="title"><label data-i18n="sDiagnostics"></label><small data-i18n="diagnosticsHint"></small></div>
          <button class="btn" id="export-diagnostics" data-i18n="exportDiagnostics"></button>
        </div>
        <div class="row">
          <div class="title"><label for="crash-records" data-i18n="crashRecords"></label><small data-i18n="crashRecordsHint"></small></div>
          <input type="checkbox" class="switch" id="crash-records" />
        </div>
      </div>
      <p class="hint" id="diagnostics-status" role="status" hidden></p>
      <h2 data-i18n="sBackup"></h2>
      <div class="group">
        <div class="row">
          <div class="title"><label for="backup-passphrase" data-i18n="backupPassphrase"></label><small data-i18n="backupHint"></small></div>
        </div>
        <div class="row">
          <div class="presence-path">
            <input type="password" id="backup-passphrase" autocomplete="new-password" spellcheck="false" />
            <button class="btn" id="backup-export" data-i18n="backupExport"></button>
            <button class="btn" id="backup-restore" data-i18n="backupRestore"></button>
          </div>
        </div>
      </div>
      <input type="file" id="backup-file" accept=".slopbar-backup" hidden />
      <div class="group" id="backup-preview" hidden></div>
      <p class="hint" id="backup-status" role="status" hidden></p>
    </section>

    <!-- Health -->
    <section class="page" id="page-health">
      <header><h1 data-i18n="sHealth"></h1><p data-i18n="descHealth"></p></header>
      <div class="group" id="health"></div>
      <p class="hint" id="health-status" role="status" hidden></p>
      <p class="hint" data-i18n="healthHow"></p>
    </section>
  </main>
  </div>

  <script type="module" src="settings.js"></script>
</body>
</html>
