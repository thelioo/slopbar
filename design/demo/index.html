<!doctype html>
<html lang="en" data-slopbar-host>
<head>
<meta charset="utf-8" />
<title>SlopBar demo</title>
<!--
  Scripted demo for recording design/demo.gif. It runs the real widget and flyout (app.html,
  built from src/index.html) in a fake taskbar (desktop.js) and plays a timeline: open the
  flyout, then switch to a light taskbar, and back so the recording loops.
  Run `pnpm site` and open /design/demo/.
-->
<script src="backend.js"></script>
</head>
<body>
<script type="module">
import { move, click, sleep, setFlyout, setTheme, centerOf, widget, frames } from "./desktop.js";

const rest = [760, 330];
const atWidget = () => centerOf(frames.dock, widget());
window.demoReady = true;
await sleep(900);

// Click the widget: the flyout lists every account.
await move(...atWidget(), 1000);
await click(widget());
await sleep(3200);
await move(...rest, 800);
setFlyout(false);
await sleep(700);

// It follows the taskbar's theme.
setTheme("light");
await sleep(1200);
await move(...atWidget(), 900);
await click(widget());
await sleep(2600);
await move(...rest, 800);
setFlyout(false);
await sleep(700);

// Back to the start, so the recording loops.
setTheme("dark");
await sleep(1200);
window.demoDone = true;
</script>
</body>
</html>
