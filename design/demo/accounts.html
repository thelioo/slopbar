<!doctype html>
<html lang="en" data-slopbar-host>
<head>
<meta charset="utf-8" />
<title>SlopBar accounts demo</title>
<!--
  Scripted demo for recording design/accounts.gif: switching accounts from the flyout, then the
  balancer switching back on its own when the active account hits its limit. Runs the real
  widget and flyout (app.html) in a fake taskbar (desktop.js). Run `pnpm site` and open
  /design/demo/accounts.html.
-->
<script src="backend.js"></script>
</head>
<body>
<script type="module">
import { move, click, sleep, setFlyout, centerOf, widget, frames } from "./desktop.js";

const { state, emit, snapshot } = window.slopbar;
const hours = (h) => new Date(Date.now() + h * 3.6e6).toISOString();

// Two Claude accounts (Work is running hot) and one Codex account.
const accounts = (active, personalSession, workSession) => [
  { id: "personal", provider: "claude", email: "me@gmail.com", plan: "pro", org: null, active: active === "personal",
    windows: [{ kind: "session", used_percent: personalSession, resets_at: hours(4.6) }, { kind: "weekly", used_percent: 18, resets_at: hours(96) }] },
  { id: "work", provider: "claude", email: "me@acme.com", plan: "max", org: "Acme", active: active === "work",
    windows: [{ kind: "session", used_percent: workSession, resets_at: hours(0.4) }, { kind: "weekly", used_percent: 52, resets_at: hours(60) }] },
  { id: "codex", provider: "codex", email: "you@example.com", plan: "pro", active: true,
    windows: [{ kind: "session", used_percent: 41, resets_at: hours(3) }, { kind: "weekly", used_percent: 76, resets_at: hours(44) }] },
];
const show = (list) => {
  state.accounts = list;
  emit("usage-updated", snapshot());
};

show(accounts("work", 12, 88));
state.switchDelay = 650;
const rest = [760, 330];
const atWidget = () => centerOf(frames.dock, widget());
window.demoReady = true;
await sleep(900);

// Open the flyout and switch to the Personal account by hand.
await move(...atWidget(), 900);
await click(widget());
await sleep(1300);
const use = frames.panel.contentDocument.querySelector("button.use");
await move(...centerOf(frames.panel, use), 800);
await sleep(250);
await click(use);
await sleep(1700);
await move(...rest, 700);
setFlyout(false);
await sleep(2600);

// Personal fills up; at 90% the balancer switches back to Work (whose session has reset).
for (let p = 14; p <= 92; p += 3) {
  show(accounts("personal", p, 88));
  await sleep(110);
}
show(accounts("work", 92, 3));
emit("account-switched", { provider: "claude", from: "Personal", to: "Work", auto: true });
await sleep(3300);

// Open to show Work in use again.
await move(...atWidget(), 800);
await click(widget());
await sleep(2600);
await move(...rest, 700);
setFlyout(false);
await sleep(700);
window.demoDone = true;
</script>
</body>
</html>
