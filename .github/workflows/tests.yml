name: Tests

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable
      - name: Unit tests (desktop build)
        run: cargo test --locked --lib --manifest-path src-tauri/Cargo.toml
      - name: Agent tool (slopbar-mcp) builds without the desktop app
        run: cargo build --locked --bin slopbar-mcp --no-default-features --manifest-path src-tauri/Cargo.toml
