name: Release

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: lts/*
          cache: pnpm

      - uses: dtolnay/rust-toolchain@stable

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target

      - run: pnpm install --frozen-lockfile

      # Every build on main is a release: 0.2.<run number>. Usage Bar (the old repo) published
      # 0.1.x, so SlopBar's releases must stay above them for those installs to update.
      - name: Set version
        id: version
        shell: pwsh
        run: |
          $version = "0.2.${{ github.run_number }}"
          $conf = Get-Content src-tauri/tauri.conf.json -Raw | ConvertFrom-Json
          $conf.version = $version
          $conf | ConvertTo-Json -Depth 20 | Set-Content src-tauri/tauri.conf.json
          "version=$version" >> $env:GITHUB_OUTPUT

      # Pull requests have no signing key: build without updater artifacts.
      - name: Build
        if: github.event_name == 'pull_request'
        run: pnpm tauri build --config '{"bundle":{"createUpdaterArtifacts":false}}'

      - name: Build and release
        if: github.event_name != 'pull_request'
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Signs the installers; the app only accepts updates signed with this key.
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ""
        with:
          tagName: v${{ steps.version.outputs.version }}
          releaseName: SlopBar v${{ steps.version.outputs.version }}
          releaseBody: Built from ${{ github.sha }}.
          releaseDraft: false
          prerelease: false
          includeUpdaterJson: true
          uploadPlainBinary: true
